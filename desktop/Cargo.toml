[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/server", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
jsonwebtoken = "9"
argon2 = "0.5"
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
parking_lot = "0.12"
regex = "1"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
tokio-stream = "0.1"
urlencoding = "2"
rand = "0.8"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
