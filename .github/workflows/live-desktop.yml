name: Test Live Desktop Functions
on:
  push:
    branches: [fix/live-generation-tests]
    paths:
      - .github/workflows/live-desktop.yml
      - desktop/scripts/live-*.py
      - desktop/scripts/live-*.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Set private test paths
        run: |
          "PRIVATE_DIR=$env:RUNNER_TEMP/live-private" >> $env:GITHUB_ENV
          "EVIDENCE_DIR=$env:RUNNER_TEMP/live-evidence" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet cryptography
      - name: Create one-run public handoff key
        run: python desktop/scripts/live-audit-envelope.py bootstrap --private-dir "$env:PRIVATE_DIR" --output "$env:RUNNER_TEMP/live-public"
      - uses: actions/upload-artifact@v4
        with:
          name: live-public-key
          path: ${{ runner.temp }}/live-public/bootstrap.json
          retention-days: 1
      - name: Receive authenticated encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python desktop/scripts/live-audit-envelope.py receive --private-dir "$env:PRIVATE_DIR"
      - name: Discover actual provider models
        run: python desktop/scripts/live-audit-envelope.py probe --private-dir "$env:PRIVATE_DIR" --output "$env:EVIDENCE_DIR/provider-models.json"
      - name: Download published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.5 --pattern '*x64-setup.exe' --dir artifacts
      - name: Test configured native desktop UI
        shell: powershell
        run: |
          $installer = (Get-ChildItem artifacts -Filter '*-setup.exe' | Select-Object -First 1).FullName
          ./desktop/scripts/live-windows.ps1 -Installer $installer -OutputDir "$env:RUNNER_TEMP/live-app" -PrivateDir "$env:PRIVATE_DIR" -EvidenceDir "$env:EVIDENCE_DIR"
      - name: Encrypt evidence for the requesting client
        if: always()
        run: python desktop/scripts/live-audit-envelope.py seal --private-dir "$env:PRIVATE_DIR" --source "$env:EVIDENCE_DIR" --output "$env:RUNNER_TEMP/live-evidence.enc.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-encrypted-evidence
          path: ${{ runner.temp }}/live-evidence.enc.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Remove private run material
        if: always()
        run: |
          Remove-Item -LiteralPath "$env:PRIVATE_DIR" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/live-app/data" -Recurse -Force -ErrorAction SilentlyContinue
