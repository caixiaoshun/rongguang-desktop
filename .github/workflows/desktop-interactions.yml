name: Check Desktop Interactions
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version to inspect
        default: v0.1.4
        type: string
      artifact_run_id:
        description: Build Desktop run ID (empty uses the published version)
        default: ''
        type: string
  push:
    branches: [fix/desktop-interactions]
    paths:
      - .github/workflows/desktop-interactions.yml
      - desktop/scripts/explore-windows.ps1
permissions:
  contents: read
  actions: read
jobs:
  interact:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select installer built from the same application source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.artifact_run_id }}
        run: |
          $runId = $env:REQUESTED_RUN
          if ('${{ github.event_name }}' -eq 'push') {
            $sourceSha = git log -1 --format=%H -- web desktop/crates desktop/src-tauri desktop/Cargo.toml desktop/Cargo.lock
            $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/build-desktop.yml/runs?head_sha=$sourceSha&per_page=10" --jq '.workflow_runs | map(select(.status == "completed")) | .[0].id'
            if ($LASTEXITCODE -ne 0 -or -not $runId -or $runId -eq 'null') { throw "No completed build for application source $sourceSha" }
          }
          if ($runId) {
            $buildSha = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" --jq '.head_sha'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve artifact source' }
            git diff --quiet $buildSha HEAD -- web desktop/crates desktop/src-tauri desktop/Cargo.toml desktop/Cargo.lock
            if ($LASTEXITCODE -ne 0) { throw 'Installer source differs from the code under test' }
            Write-Host "Testing installer from $buildSha (run $runId)"
          }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
      - name: Download published installer
        if: steps.source.outputs.run_id == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.1.4' }}
        run: gh release download "$env:RELEASE_TAG" --pattern '*x64-setup.exe' --dir artifacts
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.run_id != ''
        with:
          name: rongguang-windows-x64
          path: artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Click through the installed desktop app
        shell: powershell
        run: |
          $installer = (Get-ChildItem artifacts -Filter '*-setup.exe' | Select-Object -First 1).FullName
          ./desktop/scripts/explore-windows.ps1 -Installer $installer -OutputDir "$env:RUNNER_TEMP/interaction-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-interaction-evidence
          path: ${{ runner.temp }}/interaction-audit/evidence/**
          if-no-files-found: error
